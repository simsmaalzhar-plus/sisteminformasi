<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIM Monitoring - SMA Al Azhar Plus Kota Bogor</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap');

:root{
  --primary:#0B6E4F;
  --primary-dark:#075038;
  --primary-light:#E4F2EB;
  --accent:#C9962C;
  --bg:#F6F4EE;
  --surface:#FFFFFF;
  --ink:#1C2321;
  --muted:#6B7280;
  --border:#E7E3D8;
  --danger:#C0392B;
  --danger-light:#FBEAE8;
  --success:#1E8E5A;
  --warn:#B8860B;
  --radius:16px;
  --font-display:'Plus Jakarta Sans', 'Segoe UI', sans-serif;
  --font-body:'Inter', 'Segoe UI', sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.font-display{font-family:var(--font-display);}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
input, select, textarea{font-family:inherit; font-size:14px;}
::selection{background:var(--primary-light); color:var(--primary-dark);}

/* ---------- Scrollbar ---------- */
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:#D8D3C4; border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Utility ---------- */
.hidden{display:none !important;}
.flex{display:flex;}
.flex-col{display:flex; flex-direction:column;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.gap-8{gap:8px;} .gap-12{gap:12px;} .gap-16{gap:16px;}

/* ================= LOGIN ================= */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
  padding:20px;
  box-sizing:border-box;
  background:
    radial-gradient(circle at 15% 20%, rgba(11,110,79,0.10), transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(201,150,44,0.12), transparent 45%),
    var(--bg);
}
.arch-bg{
  position:absolute; inset:0; pointer-events:none; opacity:0.5;
}
.login-card{
  width:100%; max-width:400px;
  background:var(--surface);
  border-radius:24px;
  box-shadow:0 20px 60px -20px rgba(11,110,79,0.25), 0 2px 8px rgba(0,0,0,0.04);
  padding:40px 36px 32px;
  position:relative;
  z-index:2;
  border:1px solid var(--border);
}
.login-logo-wrap{
  display:flex; flex-direction:column; align-items:center;
  margin-bottom:22px;
}
.login-logo-wrap img{
  width:88px; height:88px; object-fit:contain;
  filter:drop-shadow(0 6px 14px rgba(11,110,79,0.25));
  margin-bottom:14px;
}
.school-name{
  font-family:var(--font-display);
  font-weight:800;
  font-size:19px;
  text-align:center;
  color:var(--primary-dark);
  line-height:1.3;
}
.login-sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-top:6px;
  letter-spacing:0.2px;
}
.arch-divider{
  height:14px; width:56px; margin:18px auto 20px;
  background:
    radial-gradient(circle at 50% 100%, transparent 8px, var(--accent) 8.5px) top/100% 200% no-repeat;
  opacity:0.8;
}
.field{margin-bottom:16px;}
.field label{
  display:block; font-size:12.5px; font-weight:600; color:var(--muted);
  margin-bottom:6px; text-transform:uppercase; letter-spacing:0.4px;
}
.field input, .field select, .field textarea{
  width:100%; padding:11px 14px;
  border:1.5px solid var(--border); border-radius:10px;
  background:#FBFAF6;
  transition:border-color .15s, box-shadow .15s;
  color:var(--ink);
}
.field input:focus, .field select:focus, .field textarea:focus{
  outline:none; border-color:var(--primary); background:#fff;
  box-shadow:0 0 0 3px var(--primary-light);
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:11px 20px; border-radius:10px; border:none;
  font-weight:600; font-size:14px; transition:transform .1s, box-shadow .15s, background .15s;
}
.btn:active{transform:scale(0.98);}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 4px 14px -4px rgba(11,110,79,0.5);}
.btn-primary:hover{background:var(--primary-dark);}
.btn-block{width:100%;}
.btn-accent{background:var(--accent); color:#fff;}
.btn-outline{background:transparent; border:1.5px solid var(--border); color:var(--ink);}
.btn-outline:hover{border-color:var(--primary); color:var(--primary);}
.btn-danger{background:var(--danger-light); color:var(--danger);}
.btn-danger:hover{background:var(--danger); color:#fff;}
.btn-sm{padding:7px 12px; font-size:12.5px; border-radius:8px;}
.btn-icon{padding:8px; border-radius:8px; background:transparent;}
.btn-icon:hover{background:var(--primary-light);}
/* Ukuran default ikon SVG di dalam tombol, agar tidak tampil sebagai kotak besar tanpa bentuk */
.btn svg, .btn-icon svg{width:16px; height:16px; flex-shrink:0; display:block;}
.btn-sm svg{width:14px; height:14px;}

.login-error{
  background:var(--danger-light); color:var(--danger);
  font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:14px;
  display:none;
}
.login-hint{
  margin-top:18px; text-align:center; font-size:12px; color:var(--muted);
  background:#FBFAF6; border:1px dashed var(--border); border-radius:10px; padding:10px;
}

/* ================= APP SHELL ================= */
#app-shell{display:none; min-height:100vh;}
#app-shell.active{display:flex;}

.sidebar{
  width:264px; flex-shrink:0;
  background:linear-gradient(180deg, var(--primary-dark), var(--primary) 70%);
  color:#fff;
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
  overflow-y:auto;
}
.sidebar-header{
  padding:26px 22px 20px;
  display:flex; align-items:center; gap:12px;
  border-bottom:1px solid rgba(255,255,255,0.14);
  position:relative;
}
.sidebar-header::after{
  content:"";
  position:absolute; left:0; right:0; bottom:-1px; height:10px;
  background:
    radial-gradient(circle at 20% 0%, transparent 9px, rgba(255,255,255,0.14) 9.5px) top/24px 100% repeat-x;
  opacity:0.5;
}
.sidebar-header img{width:42px; height:42px; object-fit:contain; flex-shrink:0;}
.sidebar-header .school-title{font-family:var(--font-display); font-weight:800; font-size:13.5px; line-height:1.35;}
.sidebar-header .school-title small{display:block; font-weight:500; font-size:10.5px; opacity:0.75; margin-top:2px; text-transform:uppercase; letter-spacing:0.5px;}

.nav-group{padding:16px 12px; flex:1;}
.nav-label{font-size:10.5px; text-transform:uppercase; letter-spacing:1px; opacity:0.55; padding:10px 12px 6px;}
.nav-item{
  display:flex; align-items:center; gap:12px;
  padding:11px 14px; border-radius:10px; font-size:13.6px; font-weight:500;
  color:rgba(255,255,255,0.82); margin-bottom:2px;
  transition:background .15s, color .15s;
  cursor:pointer;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0; opacity:0.85;}
.nav-item:hover{background:rgba(255,255,255,0.09); color:#fff;}
.nav-item.active{background:rgba(255,255,255,0.16); color:#fff; font-weight:600;}
.nav-item.active svg{opacity:1;}
.nav-item .badge{
  margin-left:auto; background:var(--accent); color:#fff; font-size:10.5px;
  padding:1px 7px; border-radius:20px; font-weight:700;
}
.sidebar-footer{padding:14px; border-top:1px solid rgba(255,255,255,0.14);}
.user-chip{
  display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:10px;
  background:rgba(255,255,255,0.08); margin-bottom:8px;
}
.user-avatar{
  width:32px; height:32px; border-radius:40% 40% 50% 50%; background:var(--accent);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.user-chip .u-name{font-size:12.5px; font-weight:600;}
.user-chip .u-role{font-size:10.5px; opacity:0.7;}
.logout-btn{
  display:flex; align-items:center; gap:10px; width:100%; padding:9px 12px; border-radius:10px;
  background:transparent; color:rgba(255,255,255,0.75); border:1px solid rgba(255,255,255,0.18); font-size:13px; font-weight:500;
}
.logout-btn:hover{background:rgba(255,255,255,0.1); color:#fff;}

.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  padding:18px 32px; background:var(--surface); border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:10;
}
.topbar h1{font-size:20px; font-weight:800; color:var(--ink);}
.topbar .topbar-date{font-size:12.5px; color:var(--muted); margin-top:2px;}
.content{padding:28px 32px 60px; flex:1;}

/* ================= CARDS / STATS ================= */
.stat-grid{
  display:grid; grid-template-columns:repeat(auto-fit, minmax(200px,1fr)); gap:16px; margin-bottom:26px;
}
.stat-card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:20px; position:relative; overflow:hidden;
}
.stat-card .stat-icon{
  width:42px; height:42px; border-radius:40% 40% 50% 50%;
  display:flex; align-items:center; justify-content:center; margin-bottom:14px;
}
.stat-card .stat-icon svg{width:20px; height:20px;}
.stat-card .stat-value{font-family:var(--font-display); font-size:26px; font-weight:800; line-height:1;}
.stat-card .stat-label{font-size:12.5px; color:var(--muted); margin-top:6px; font-weight:500;}
.stat-card .stat-sub{font-size:11.5px; margin-top:8px; font-weight:600;}

.card{
  background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
  padding:22px; margin-bottom:20px;
}
.card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
.card-head h3{font-size:15.5px; font-weight:700;}
.card-head .card-sub{font-size:12px; color:var(--muted); margin-top:3px; font-weight:400;}

.progress-row{display:flex; align-items:center; gap:12px; margin-bottom:12px;}
.progress-row .p-label{width:110px; font-size:12.5px; font-weight:600; flex-shrink:0;}
.progress-track{flex:1; height:9px; background:#EFECE1; border-radius:20px; overflow:hidden;}
.progress-fill{height:100%; border-radius:20px; background:var(--primary);}
.progress-row .p-val{width:42px; text-align:right; font-size:12.5px; font-weight:700; color:var(--muted);}

/* ================= TABLES ================= */
.table-wrap{overflow-x:auto; border-radius:12px; border:1px solid var(--border);}
table{width:100%; border-collapse:collapse; font-size:13.2px;}
thead th{
  background:#FAF8F2; text-align:left; padding:12px 14px; font-weight:700;
  color:var(--muted); font-size:11.5px; text-transform:uppercase; letter-spacing:0.4px;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
tbody td{padding:12px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#FCFBF7;}
.pill{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:20px;
  font-size:11.5px; font-weight:700;
}
.pill-green{background:#E4F2EB; color:var(--success);}
.pill-red{background:var(--danger-light); color:var(--danger);}
.pill-amber{background:#FBF3DC; color:var(--warn);}
.pill-gray{background:#EFECE1; color:var(--muted);}
.row-actions{display:flex; gap:6px;}

.toolbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px;}
.search-input{
  flex:1; min-width:180px; padding:10px 14px; border:1.5px solid var(--border); border-radius:10px; background:#FBFAF6;
}
.search-input:focus{outline:none; border-color:var(--primary); background:#fff;}
.select-input{padding:10px 12px; border:1.5px solid var(--border); border-radius:10px; background:#FBFAF6;}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--muted);
}
.empty-state svg{width:52px; height:52px; opacity:0.35; margin-bottom:14px;}
.empty-state p{font-size:13.5px;}

/* ================= MODAL ================= */
.modal-overlay{
  position:fixed; inset:0; background:rgba(20,24,22,0.45); backdrop-filter:blur(2px);
  display:none; align-items:center; justify-content:center; z-index:100; padding:20px;
}
.modal-overlay.active{display:flex;}
.modal{
  background:var(--surface); border-radius:20px; width:100%; max-width:520px;
  max-height:88vh; overflow-y:auto; box-shadow:0 30px 80px -20px rgba(0,0,0,0.3);
}
.modal-head{
  padding:20px 24px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; background:var(--surface);
}
.modal-head h3{font-size:16px; font-weight:700;}
.modal-body{padding:22px 24px;}
.modal-foot{padding:16px 24px 22px; display:flex; gap:10px; justify-content:flex-end;}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
.form-grid .full{grid-column:1/-1;}
.checklist-item{
  display:flex; align-items:center; gap:10px; padding:11px 14px; border:1.5px solid var(--border);
  border-radius:10px; margin-bottom:8px; cursor:pointer; transition:border-color .15s, background .15s;
}
.checklist-item:hover{border-color:var(--primary);}
.checklist-item input{width:17px; height:17px; accent-color:var(--primary);}
.checklist-item.checked{border-color:var(--primary); background:var(--primary-light);}

/* ================= SETTINGS ================= */
.color-swatch-row{display:flex; gap:14px; flex-wrap:wrap;}
.color-swatch{
  display:flex; flex-direction:column; align-items:center; gap:8px; padding:14px; border:1.5px solid var(--border);
  border-radius:14px; width:110px;
}
.color-swatch input[type=color]{
  width:56px; height:56px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 2px var(--border); cursor:pointer; background:none;
}
.color-swatch .cs-label{font-size:11.5px; font-weight:600; color:var(--muted); text-align:center;}
.theme-preset{
  width:34px; height:34px; border-radius:50%; cursor:pointer; border:3px solid #fff; box-shadow:0 0 0 1.5px var(--border);
  flex-shrink:0;
}
.theme-preset:hover{box-shadow:0 0 0 2px var(--primary);}

.toast-wrap{position:fixed; top:20px; right:20px; z-index:200; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--ink); color:#fff; padding:12px 18px; border-radius:10px; font-size:13.5px; font-weight:500;
  box-shadow:0 10px 30px -10px rgba(0,0,0,0.4); display:flex; align-items:center; gap:10px;
  animation:toastIn .25s ease;
}
.toast.success{background:var(--primary-dark);}
.toast.error{background:var(--danger);}
@keyframes toastIn{from{opacity:0; transform:translateY(-8px);} to{opacity:1; transform:translateY(0);}}

textarea.code-box{
  width:100%; font-family:'Courier New', monospace; font-size:11.5px; padding:14px; border-radius:10px;
  border:1.5px solid var(--border); background:#1C2321; color:#D7F2E4; resize:vertical; line-height:1.6;
}
.info-box{
  background:#FBF3DC; border:1px solid #EAD9A0; color:#6B5417; padding:12px 14px; border-radius:10px; font-size:12.8px; line-height:1.6; margin-bottom:14px;
}
.step-num{
  display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%;
  background:var(--primary); color:#fff; font-size:11px; font-weight:700; flex-shrink:0; margin-right:8px;
}

@media (max-width:900px){
  .sidebar{position:fixed; left:-264px; z-index:50; transition:left .2s; box-shadow:0 0 40px rgba(0,0,0,0.3);}
  .sidebar.open{left:0;}
  .topbar{padding:14px 16px;}
  .content{padding:18px 16px 50px;}
  .form-grid{grid-template-columns:1fr;}
  .menu-toggle{display:flex !important;}
  .dash-grid-2{grid-template-columns:1fr !important;}
}
.menu-toggle{display:none; background:transparent; border:none; padding:6px;}

/* ================= DASHBOARD EXTRAS ================= */
.dash-grid-2{display:grid; grid-template-columns:1.3fr 1fr; gap:20px; margin-bottom:20px;}
.dash-grid-2 .card{margin-bottom:0;}
.card-icon-badge{
  width:34px; height:34px; border-radius:40% 40% 50% 50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  background:var(--primary-light); color:var(--primary);
}
.card-icon-badge svg{width:17px; height:17px;}

.donut-wrap{display:flex; align-items:center; gap:24px; flex-wrap:wrap;}
.donut-chart{
  width:150px; height:150px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; position:relative;
}
.donut-hole{
  width:92px; height:92px; border-radius:50%; background:var(--surface);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  box-shadow:inset 0 0 0 1px var(--border);
}
.donut-hole-value{font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--ink);}
.donut-hole-label{font-size:10.5px; color:var(--muted); font-weight:600; text-transform:uppercase;}
.donut-legend{flex:1; min-width:160px; display:flex; flex-direction:column; gap:9px;}
.legend-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.legend-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.legend-label{flex:1; color:var(--ink); font-weight:500;}
.legend-val{color:var(--muted); font-weight:600; font-size:11.5px;}

.rank-row{display:flex; align-items:center; gap:12px; padding:10px 4px; border-bottom:1px solid var(--border);}
.rank-row:last-child{border-bottom:none;}
.rank-medal{
  width:30px; height:30px; border-radius:40% 40% 50% 50%; background:#EFECE1; color:var(--muted);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:12.5px; flex-shrink:0;
}
.rank-medal svg{width:15px; height:15px;}
.rank-info{flex:1; min-width:0;}
.rank-name{font-size:13px; font-weight:600; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.rank-sub{font-size:11px; color:var(--muted); margin-top:1px;}
.rank-bar-wrap{flex-shrink:0;}
.rank-pct{width:38px; text-align:right; font-size:12.5px; font-weight:700; color:var(--success); flex-shrink:0;}

.attention-row{display:flex; align-items:center; gap:12px; padding:11px 4px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.attention-row:last-child{border-bottom:none;}
.attention-avatar{
  width:36px; height:36px; border-radius:40% 40% 50% 50%; background:var(--danger-light); color:var(--danger);
  display:flex; align-items:center; justify-content:center; font-weight:700; font-size:13px; flex-shrink:0;
}
.attention-info{flex:1; min-width:100px;}
.attention-name{font-size:13px; font-weight:600;}
.attention-sub{font-size:11px; color:var(--muted);}
.attention-badges{display:flex; gap:6px; flex-wrap:wrap;}
.attention-badges .pill svg{width:11px; height:11px;}

.tugas-row{display:flex; align-items:center; gap:12px; padding:12px 4px; border-bottom:1px solid var(--border); flex-wrap:wrap;}
.tugas-row:last-child{border-bottom:none;}
.tugas-check{
  width:26px; height:26px; border-radius:50%; border:none; background:transparent; color:#C9C4B4; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; transition:color .15s, transform .1s;
}
.tugas-check:hover{color:var(--success); transform:scale(1.15);}
.tugas-check svg{width:22px; height:22px;}
.tugas-info{flex:1; min-width:160px;}
.tugas-title{font-size:13.5px; font-weight:600; color:var(--ink);}
.tugas-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}
.tugas-row .pill svg{width:11px; height:11px;}

.pill svg{width:12px; height:12px; flex-shrink:0;}

/* ---- Sub-tab (Data Siswa / Nilai Siswa) ---- */
.subtab-row{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--border); padding-bottom:2px;}
.subtab-btn{
  display:inline-flex; align-items:center; gap:7px; padding:9px 14px; border:none; background:transparent;
  font-size:13px; font-weight:600; color:var(--muted); border-radius:8px 8px 0 0; position:relative; top:1px;
  border-bottom:2px solid transparent; transition:color .15s, border-color .15s;
}
.subtab-btn svg{width:15px; height:15px;}
.subtab-btn:hover{color:var(--primary);}
.subtab-btn.active{color:var(--primary); border-bottom-color:var(--primary);}

/* ---- Pilihan mata pelajaran (checkbox chips) ---- */
.mapel-check-grid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(190px,1fr)); gap:8px;
  max-height:220px; overflow-y:auto; padding:12px; border:1.5px solid var(--border); border-radius:10px; background:#FBFAF6;
}
.mapel-check-item{display:flex; align-items:center; gap:8px; font-size:12.8px; color:var(--ink); cursor:pointer;}
.mapel-check-item input{width:15px; height:15px; accent-color:var(--primary); flex-shrink:0; cursor:pointer;}

/* ---- Data storage / export notice ---- */
.storage-note{
  display:flex; gap:10px; align-items:flex-start; background:var(--primary-light); color:var(--primary-dark);
  border-radius:10px; padding:12px 14px; font-size:12.5px; line-height:1.6; margin-bottom:16px;
}
.storage-note svg{width:18px; height:18px; flex-shrink:0; margin-top:1px;}

/* ---- Stacked bar (kehadiran guru) ---- */
.stacked-bar{
  display:flex; width:100%; height:16px; border-radius:20px; overflow:hidden; background:#EFECE1; margin-bottom:14px;
}
.stacked-bar div{height:100%; transition:width .3s;}
.stacked-legend{display:flex; flex-direction:column; gap:9px;}

/* ---- Sidebar mobile backdrop ---- */
.sidebar-backdrop{
  display:none; position:fixed; inset:0; background:rgba(20,24,22,0.45); z-index:45;
}
.sidebar-backdrop.active{display:block;}

/* ---- Extra small screens ---- */
@media (max-width:480px){
  .login-card{padding:30px 22px 26px; border-radius:18px;}
  .login-logo-wrap img{width:72px; height:72px;}
  .school-name{font-size:16.5px;}
  .stat-grid{grid-template-columns:repeat(2, 1fr); gap:10px;}
  .stat-card{padding:14px;}
  .stat-card .stat-value{font-size:21px;}
  .stat-card .stat-icon{width:34px; height:34px; margin-bottom:10px;}
  .card{padding:16px;}
  .modal-body{padding:16px;}
  .modal-foot{padding:12px 16px 16px;}
  .donut-wrap{justify-content:center;}
  .topbar h1{font-size:17px;}
  .content{padding:14px 12px 50px;}
  thead th, tbody td{padding:10px;}
}

</style>
</head>

/* ---------------- Storage lokal (mode offline/demo) ---------------- */
const STORAGE_PREFIX = 'simazp_';
let _memoryFallback = {};
let _storageAvailable = true;
(function testStorage(){
  try{
    const k = '__test__'+Date.now();
    window.localStorage.setItem(k, '1');
    window.localStorage.removeItem(k);
  }catch(e){ _storageAvailable = false; }
})();
async function storageGet(key, fallback){
  try{
    if(_storageAvailable){
      const raw = window.localStorage.getItem(STORAGE_PREFIX+key);
      if(raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    }else{
      return (key in _memoryFallback) ? JSON.parse(_memoryFallback[key]) : fallback;
    }
  }catch(e){ return fallback; }
}
async function storageSet(key, value){
  try{
    const raw = JSON.stringify(value);
    if(_storageAvailable){ window.localStorage.setItem(STORAGE_PREFIX+key, raw); }
    else{ _memoryFallback[key] = raw; }
    return true;
  }catch(e){ console.error('storage set failed', key, e); return false; }
}

const LOCAL_KEY = {
  siswa:'siswa-list', guru:'guru-list', kehadiran:'kehadiran-records',
  kedisiplinan:'kedisiplinan-records', kebersihan:'kebersihan-records',
  mengajar:'mengajar-records', tugas:'tugas-records', nilai:'nilai-records', mapel:'mapel-list',
};

/* ---------------- Lapisan Akses Data (DAL) ----------------
   upsertRecord/removeRecord dipakai oleh semua modul CRUD.
   Jika Firebase aktif -> tulis ke Firebase Realtime Database,
   dan tampilan akan ter-update otomatis lewat listener realtime.
   Jika tidak -> simpan ke localStorage seperti sebelumnya, lalu
   panggil callback re-render secara manual. */
async function upsertRecord(collection, data, isEdit, onLocalUpdate){
  if(firebaseReady){
    try{
      await firebaseDB.ref('data/'+collection+'/'+data.id).set(data);
    }catch(err){
      console.error('Gagal menyimpan ke Firebase ('+collection+'):', err);
      toast('Gagal menyimpan data ke Firebase: '+(err&&err.message?err.message:'periksa Security Rules Firebase Anda'), 'error');
      throw err;
    }
  }else{
    DB[collection] = isEdit ? DB[collection].map(x=>x.id===data.id?data:x) : [...DB[collection], data];
    await storageSet(LOCAL_KEY[collection], DB[collection]);
    if(onLocalUpdate) onLocalUpdate();
  }
}
async function removeRecord(collection, id, onLocalUpdate){
  if(firebaseReady){
    try{
      await firebaseDB.ref('data/'+collection+'/'+id).remove();
    }catch(err){
      console.error('Gagal menghapus dari Firebase ('+collection+'):', err);
      toast('Gagal menghapus data di Firebase: '+(err&&err.message?err.message:'periksa Security Rules Firebase Anda'), 'error');
      throw err;
    }
  }else{
    DB[collection] = DB[collection].filter(x=>x.id!==id);
    await storageSet(LOCAL_KEY[collection], DB[collection]);
    if(onLocalUpdate) onLocalUpdate();
  }
}
/* Tulis banyak record sekaligus (dipakai untuk simpan absensi 1 kelas) */
async function bulkUpsert(collection, records, removeIds, onLocalUpdate){
  if(firebaseReady){
    const updates = {};
    (removeIds||[]).forEach(id=> updates['data/'+collection+'/'+id] = null);
    records.forEach(r=> updates['data/'+collection+'/'+r.id] = r);
    try{
      await firebaseDB.ref().update(updates);
    }catch(err){
      console.error('Gagal menyimpan banyak data ke Firebase ('+collection+'):', err);
      toast('Gagal menyimpan data ke Firebase: '+(err&&err.message?err.message:'periksa Security Rules Firebase Anda'), 'error');
      throw err;
    }
  }else{
    DB[collection] = DB[collection].filter(x=> !(removeIds||[]).includes(x.id));
    DB[collection] = [...DB[collection], ...records];
    await storageSet(LOCAL_KEY[collection], DB[collection]);
    if(onLocalUpdate) onLocalUpdate();
  }
}

function initFirebase(config){
  try{
    if(firebaseApp){ try{ firebaseApp.delete(); }catch(e){} firebaseApp=null; }
    firebaseApp = firebase.initializeApp(config, 'main');
    firebaseAuth = firebaseApp.auth();
    firebaseDB = firebaseApp.database();
    firebaseReady = true;
    return true;
  }catch(e){
    console.error('Firebase init gagal', e);
    firebaseReady = false;
    return false;
  }
}
function detachFirebaseListeners(){
  fbListeners.forEach(({ref, fn})=> ref.off('value', fn));
  fbListeners = [];
}
function attachFirebaseListeners(){
  const collections = ['siswa','guru','kehadiran','kedisiplinan','kebersihan','mengajar','tugas','nilai','mapel'];
  const erroredCols = new Set();
  let mapelSeedTried = false;
  collections.forEach(col=>{
    const ref = firebaseDB.ref('data/'+col);
    const fn = ref.on('value', snap=>{
      const val = snap.val() || {};
      DB[col] = Object.keys(val).map(id=>({...val[id], id}));
      onCollectionUpdated(col);
      // Isi otomatis daftar mata pelajaran standar sekali saja bila koleksi masih kosong
      if(col==='mapel' && DB.mapel.length===0 && !mapelSeedTried){
        mapelSeedTried = true;
        const records = DEFAULT_MAPEL_LIST.map(nama=>({id:uid(), nama}));
        bulkUpsert('mapel', records, [], null).catch(()=>{ /* pesan error sudah ditampilkan oleh bulkUpsert */ });
      }
    }, err=>{
      if(erroredCols.has(col)) return; // hindari toast berulang untuk koleksi yang sama
      erroredCols.add(col);
      console.error('Gagal membaca data Firebase ('+col+'):', err);
      toast('Gagal memuat data "'+col+'" dari Firebase: '+(err&&err.message?err.message:'periksa Security Rules Firebase Anda'), 'error');
    });
    fbListeners.push({ref, fn});
  });
}
function onCollectionUpdated(col){
  const affects = {
    siswa: ['siswa','dashboard','kehadiran','kedisiplinan','tugas','mengajar'],
    guru: ['guru','dashboard','tugas','mengajar'],

}

/* ---------------- Util umum ---------------- */
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function formatDateLong(d){
  const opts = {weekday:'long', year:'numeric', month:'long', day:'numeric'};
  try{ return new Date(d+'T00:00:00').toLocaleDateString('id-ID', opts); }catch(e){ return d; }
}
function formatDateShort(d){
  try{ return new Date(d+'T00:00:00').toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'}); }catch(e){ return d; }
}
function escapeHtml(str){
  if(str===undefined||str===null) return '';
  return String(str).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function initials(name){
  if(!name) return '?';
  const parts = name.trim().split(' ');
  return (parts[0][0]+(parts[1]?parts[1][0]:'')).toUpperCase();
}
function toast(msg, type){
  const wrap = document.getElementById('toast-wrap');
  const el = document.createElement('div');
  el.className = 'toast '+(type||'');
  el.innerHTML = (type==='success'?ICONS.check:type==='error'?ICONS.close:'');
  const span = document.createElement('span');
  span.textContent = msg;
  el.appendChild(span);
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(), 300); }, 3200);
}

/* ---------------- Tema ---------------- */
function applyTheme(theme){
  const root = document.documentElement.style;
  root.setProperty('--primary', theme.primary);
  root.setProperty('--primary-dark', theme.primaryDark);
  root.setProperty('--accent', theme.accent);
  root.setProperty('--bg', theme.bg);
  root.setProperty('--primary-light', hexToLight(theme.primary));
}
function hexToLight(hex){
  try{
    const c = hex.replace('#','');
    const r = parseInt(c.substring(0,2),16), g = parseInt(c.substring(2,4),16), b = parseInt(c.substring(4,6),16);
    const mix = (v)=> Math.round(v + (255-v)*0.87);
    return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
  }catch(e){ return '#E4F2EB'; }
}

/* ================= DASHBOARD HELPERS ================= */
function computeAttendanceTrend(maxDays){
  const byDate = {};
  DB.kehadiran.forEach(r=>{
    if(!r.siswaId) return; // lewati ringkasan agregat guru
    if(!byDate[r.tanggal]) byDate[r.tanggal] = {hadir:0, total:0};
    byDate[r.tanggal].total++;
    if(r.status==='Hadir') byDate[r.tanggal].hadir++;
  });
  const dates = Object.keys(byDate).sort();
  const recent = dates.slice(-maxDays);
  return recent.map(d=>({tanggal:d, pct: Math.round(byDate[d].hadir/byDate[d].total*100)}));
}
function computeTopSiswaKehadiran(limit){
  const byStudent = {};
  DB.kehadiran.forEach(r=>{
    if(!r.siswaId) return;
    if(!byStudent[r.siswaId]) byStudent[r.siswaId] = {hadir:0, total:0, nama:r.nama};
    byStudent[r.siswaId].total++;
    if(r.status==='Hadir') byStudent[r.siswaId].hadir++;
  });
  return Object.entries(byStudent)
    .filter(([id,v])=>v.total>=2)
    .map(([id,v])=>{
      const siswa = DB.siswa.find(s=>s.id===id);
      return {id, nama:v.nama, kelas: siswa?siswa.kelas:'-', pct: Math.round(v.hadir/v.total*100), total:v.total};
    })
    .sort((a,b)=> b.pct-a.pct || b.total-a.total)
    .slice(0, limit);
}
function computePelanggaranDistribution(){
  const counts = {};
  DB.kedisiplinan.forEach(r=>{ counts[r.jenis] = (counts[r.jenis]||0)+1; });
  const total = DB.kedisiplinan.length;
  const colors = ['#0B6E4F','#C9962C','#1D4ED8','#B91C1C','#7C3AED','#0E7490','#6B7280'];
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([jenis,count],i)=>({
    jenis, count, pct: total? Math.round(count/total*100) : 0, color: colors[i%colors.length]
  }));
}
function computeSiswaPerhatian(){
  const flagged = {};
  const byStudent = {};
  DB.kehadiran.forEach(r=>{
    if(!r.siswaId) return;
    if(!byStudent[r.siswaId]) byStudent[r.siswaId] = {hadir:0, total:0, nama:r.nama};
    byStudent[r.siswaId].total++;
    if(r.status==='Hadir') byStudent[r.siswaId].hadir++;
  });
  Object.entries(byStudent).forEach(([id,v])=>{
    if(v.total>=3){
      const pct = Math.round(v.hadir/v.total*100);
      if(pct<80){
        const siswa = DB.siswa.find(s=>s.id===id);
        flagged[id] = flagged[id] || {id, nama:v.nama, kelas: siswa?siswa.kelas:'-', reasons:[]};
        flagged[id].reasons.push({type:'kehadiran', text:'Kehadiran '+pct+'%'});
      }
    }
  });
  const poinByStudent = {};
  DB.kedisiplinan.forEach(r=>{
    if(!poinByStudent[r.siswaId]) poinByStudent[r.siswaId] = {poin:0, nama:r.namaSiswa, kelas:r.kelas};
    poinByStudent[r.siswaId].poin += Number(r.poin)||0;
  });
  Object.entries(poinByStudent).forEach(([id,v])=>{
    if(v.poin>=15){
      flagged[id] = flagged[id] || {id, nama:v.nama, kelas:v.kelas, reasons:[]};
      flagged[id].reasons.push({type:'disiplin', text:v.poin+' poin pelanggaran'});
    }
  });
  return Object.values(flagged).sort((a,b)=>b.reasons.length-a.reasons.length);
}

/* ---------------- Grafik garis SVG (tren kehadiran) ---------------- */
function lineChartSVG(data){
  const w = 640, h = 220, padL = 36, padR = 16, padT = 16, padB = 30;
  const innerW = w - padL - padR, innerH = h - padT - padB;
  const n = data.length;
  const stepX = n>1 ? innerW/(n-1) : 0;
  const pts = data.map((d,i)=>{
    const x = padL + stepX*i;
    const y = padT + innerH - (d.pct/100)*innerH;
    return {x, y, ...d};
  });
  const linePath = pts.map((p,i)=> (i===0?'M':'L')+p.x.toFixed(1)+','+p.y.toFixed(1)).join(' ');
  const areaPath = linePath + ` L${pts[pts.length-1].x.toFixed(1)},${padT+innerH} L${pts[0].x.toFixed(1)},${padT+innerH} Z`;
  const gridLines = [0,25,50,75,100].map(v=>{
    const y = padT + innerH - (v/100)*innerH;
    return `<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" stroke="#EFECE1" stroke-width="1"/><text x="${padL-8}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}%</text>`;
  }).join('');
  const labelEvery = Math.max(1, Math.ceil(n/6));
  const labels = pts.map((p,i)=> i%labelEvery===0 || i===pts.length-1 ? `<text x="${p.x}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${formatDateShort(p.tanggal).replace(/ \d{4}$/,'')}</text>` : '').join('');
  const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="var(--primary)" stroke="#fff" stroke-width="1.5"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; max-height:260px;" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--primary)" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="var(--primary)" stop-opacity="0"/>
    </linearGradient></defs>
    ${gridLines}
    <path d="${areaPath}" fill="url(#areaGrad)"/>
    <path d="${linePath}" fill="none" stroke="var(--primary)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${dots}
    ${labels}
  </svg>`;
}

  const trend = computeAttendanceTrend(10);
  const distribusi = computePelanggaranDistribution();
  const isGuru = currentUser.role==='guru';

  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="stat-grid">
      ${statCard(ICONS.siswa, totalSiswa, 'Total Siswa', '', 'var(--primary)')}
      ${!isGuru?statCard(ICONS.guru, totalGuru, 'Total Guru', '', 'var(--accent)'):''}
      ${statCard(ICONS.kehadiran, kehadiranDetailHariIni.length? pctHadir+'%' : '-', 'Kehadiran Hari Ini', kehadiranDetailHariIni.length? hadirCount+' dari '+kehadiranDetailHariIni.length+' tercatat' : 'Belum ada data', pctHadir>=85?'var(--success)':'var(--warn)')}
      ${!isGuru?statCard(ICONS.disiplin, pelanggaranHariIni, 'Pelanggaran Hari Ini', 'Kedisiplinan siswa', pelanggaranHariIni>0?'var(--danger)':'var(--success)'):''}
      ${!isGuru?statCard(ICONS.bersih, avgBersih!==null? avgBersih+'%':'-', 'Rata-rata Kebersihan', avgBersih!==null? kebersihanHariIni.length+' kelas dinilai':'Belum ada data', 'var(--primary)'):''}
      ${statCard(ICONS.mengajar, sesiGuruHariIni.length? pctMengajar+'%':'-', 'Kehadiran Guru Hari Ini', sesiGuruHariIni.length? sesiGuruMengajar.length+' dari '+sesiGuruHariIni.length+' sesi ada materi':'Belum ada data', 'var(--accent)')}
      ${!isGuru?statCard(ICONS.warningTriangle, siswaPerhatian.length, 'Siswa Perlu Perhatian', 'Kehadiran / kedisiplinan', siswaPerhatian.length>0?'var(--danger)':'var(--success)'):''}
      ${statCard(ICONS.clipboard, tugasPending.length, 'Tugas Belum Selesai', 'Catatan dari guru', tugasPending.length>0?'var(--warn)':'var(--success)')}
    </div>

    <div class="dash-grid-2">
      <div class="card">
        <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge">${ICONS.trend}</span><div><h3>Tren Kehadiran</h3><div class="card-sub">Persentase kehadiran keseluruhan per hari tercatat</div></div></div></div>
        <div id="dash-trend-chart"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--danger) 14%, white); color:var(--danger);">${ICONS.disiplin}</span><div><h3>Distribusi Pelanggaran</h3><div class="card-sub">Jenis pelanggaran paling sering tercatat</div></div></div></div>
        <div id="dash-donut-chart"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--accent) 16%, white); color:var(--accent);">${ICONS.trophy}</span><div><h3>Kehadiran per Kelas (Hari Ini)</h3><div class="card-sub">Persentase siswa hadir dari setiap kelas</div></div></div></div>
      <div id="dash-kehadiran-per-kelas"></div>
    </div>

    ${!isGuru?`<div class="card">
      <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--accent) 16%, white); color:var(--accent);">${ICONS.star}</span><div><h3>Rata-rata Nilai Tertinggi</h3><div class="card-sub">Peringkat siswa berdasarkan kelas, semester &amp; tahun ajaran</div></div></div></div>
      <div class="toolbar" style="margin-bottom:14px;">
        <select class="select-input" id="dash-nilai-kelas"><option value="">Semua Kelas</option>${KELAS_LIST.map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
        <select class="select-input" id="dash-nilai-semester"><option value="">Semua Semester</option>${SEMESTER_LIST.map(s=>`<option value="${s}">${s}</option>`).join('')}</select>
        <select class="select-input" id="dash-nilai-tahun"><option value="">Semua Tahun Ajaran</option>${tahunAjaranOptions().map(t=>`<option value="${t}" ${t===tahunAjaranSekarang()?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div id="dash-nilai-top"></div>
    </div>`:''}

    <div class="dash-grid-2">
      <div class="card">
        <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--accent) 16%, white); color:var(--accent);">${ICONS.mengajar}</span><div><h3>Kehadiran Guru Hari Ini</h3><div class="card-sub">Ringkasan status kehadiran guru mengajar</div></div></div></div>
        <div id="dash-guru-status"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--primary) 14%, white); color:var(--primary);">${ICONS.bersih}</span><div><h3>Kebersihan Terkini per Kelas</h3><div class="card-sub">Skor penilaian kebersihan terakhir tiap kelas</div></div></div></div>
        <div id="dash-kebersihan-per-kelas"></div>
      </div>
    </div>

    <div class="dash-grid-2">
      <div class="card">
        <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--accent) 16%, white); color:var(--accent);">${ICONS.star}</span><div><h3>5 Siswa Kehadiran Tertinggi</h3><div class="card-sub">Peringkat berdasarkan seluruh riwayat absensi</div></div></div></div>
        <div id="dash-top-siswa"></div>
      </div>
      <div class="card">
        <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--danger) 14%, white); color:var(--danger);">${ICONS.alertUser}</span><div><h3>Siswa Perlu Perhatian</h3><div class="card-sub">Kehadiran rendah atau poin pelanggaran tinggi</div></div></div></div>
        <div id="dash-perhatian"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--primary) 14%, white); color:var(--primary);">${ICONS.clipboard}</span><div><h3>Catatan Tugas dari Guru</h3><div class="card-sub">Daftar tugas yang perlu ditindaklanjuti</div></div></div>
        <button class="btn btn-primary btn-sm" id="btn-dash-add-tugas">${ICONS.plus} Tambah Catatan</button>
      </div>
      <div id="dash-tugas"></div>
    </div>

    ${!isGuru?`<div class="card">
      <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge">${ICONS.bell}</span><div><h3>Aktivitas Terbaru</h3><div class="card-sub">Catatan monitoring terakhir yang diinput</div></div></div></div>
      <div id="dash-recent"></div>
    </div>`:''}
  `;

  document.getElementById('btn-dash-add-tugas').addEventListener('click', ()=>openTugasForm(null, renderDashboard));

  if(!isGuru){
    const drawDashNilaiTop = ()=>{
      const f = {
        kelas: document.getElementById('dash-nilai-kelas').value,
        mapel: '',
        semester: document.getElementById('dash-nilai-semester').value,
        tahun: document.getElementById('dash-nilai-tahun').value,
      };
      const rows = computeRataNilaiSiswa(f).slice(0, 5);
      const block = document.getElementById('dash-nilai-top');
      if(rows.length===0){ block.innerHTML = emptyState('Belum ada data nilai yang cocok dengan filter di atas.'); return; }
      const medalColors = ['#D4A017','#9CA3AF','#B87333'];
      block.innerHTML = rows.map((r,i)=>`
        <div class="rank-row">
          <div class="rank-medal" style="${i<3?`background:${medalColors[i]}22; color:${medalColors[i]};`:''}">${i<3?ICONS.trophy:(i+1)}</div>
          <div class="rank-info"><div class="rank-name">${escapeHtml(r.nama)}</div><div class="rank-sub">${escapeHtml(r.kelas)} &bull; ${r.jumlahEntri} entri nilai</div></div>
          <div class="rank-pct" style="width:auto; font-size:16px; font-family:var(--font-display); font-weight:800; color:${r.rata>=75?'var(--success)':r.rata>=60?'var(--warn)':'var(--danger)'};">${r.rata}</div>
        </div>`).join('');
    };
    ['dash-nilai-kelas','dash-nilai-semester','dash-nilai-tahun'].forEach(id=>{
      document.getElementById(id).addEventListener('change', drawDashNilaiTop);
    });
    drawDashNilaiTop();
  }

  document.getElementById('dash-trend-chart').innerHTML = trend.length>=2 ? lineChartSVG(trend) : emptyState('Belum cukup data untuk menampilkan tren kehadiran.');

  const donutBlock = document.getElementById('dash-donut-chart');
  if(distribusi.length===0){
    donutBlock.innerHTML = emptyState('Belum ada catatan pelanggaran.');
  }else{
    const gradientParts = []; let acc = 0;
    distribusi.forEach(d=>{ gradientParts.push(`${d.color} ${acc}% ${acc+d.pct}%`); acc += d.pct; });
    if(acc<100) gradientParts.push(`#EFECE1 ${acc}% 100%`);
    donutBlock.innerHTML = `<div class="donut-wrap">
        <div class="donut-chart" style="background:conic-gradient(${gradientParts.join(',')});">
          <div class="donut-hole"><div class="donut-hole-value">${DB.kedisiplinan.length}</div><div class="donut-hole-label">Total</div></div>
        </div>
        <div class="donut-legend">${distribusi.map(d=>`<div class="legend-row"><span class="legend-dot" style="background:${d.color}"></span><span class="legend-label">${escapeHtml(d.jenis)}</span><span class="legend-val">${d.count} (${d.pct}%)</span></div>`).join('')}</div>
      </div>`;
  }

  const kelasBlock = document.getElementById('dash-kehadiran-per-kelas');
  const kelasWithData = KELAS_LIST.map(k=>{
    const total = DB.siswa.filter(s=>s.kelas===k).length;
    const rec = kehadiranDetailHariIni.filter(r=>r.kelas===k);
    const hadir = rec.filter(r=>r.status==='Hadir').length;
    const pct = rec.length ? Math.round(hadir/rec.length*100) : null;
    return {k, total, pct};
  }).filter(x=>x.total>0);
  kelasBlock.innerHTML = kelasWithData.length===0 ? emptyState('Belum ada data siswa.') : kelasWithData.map(x=>`
      <div class="progress-row"><div class="p-label">${x.k}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${x.pct||0}%; background:${x.pct===null?'#D8D3C4':(x.pct>=85?'var(--success)':x.pct>=60?'var(--warn)':'var(--danger)')}"></div></div>
        <div class="p-val">${x.pct===null?'-':x.pct+'%'}</div></div>`).join('');

  const guruStatusBlock = document.getElementById('dash-guru-status');
  if(sesiGuruHariIni.length===0){
    guruStatusBlock.innerHTML = emptyState('Belum ada sesi kehadiran guru yang tercatat hari ini.');
  }else{
    const counts = {'Mengajar':0, 'Tanpa Materi':0, 'Belum Diisi':0};
    sesiGuruHariIni.forEach(r=>{
      const key = !r.namaGuru ? 'Belum Diisi' : (r.materi ? 'Mengajar' : 'Tanpa Materi');
      counts[key]++;
    });
    const colorMap = {'Mengajar':'var(--success)', 'Tanpa Materi':'var(--warn)', 'Belum Diisi':'var(--danger)'};
    const total = sesiGuruHariIni.length;
    guruStatusBlock.innerHTML = `<div class="stacked-bar">${Object.entries(counts).filter(([k,v])=>v>0).map(([k,v])=>`<div style="width:${Math.round(v/total*100)}%; background:${colorMap[k]};" title="${k}: ${v}"></div>`).join('')}</div>
      <div class="stacked-legend">${Object.entries(counts).filter(([k,v])=>v>0).map(([k,v])=>`<div class="legend-row"><span class="legend-dot" style="background:${colorMap[k]}"></span><span class="legend-label">${k}</span><span class="legend-val">${v} sesi</span></div>`).join('')}</div>`;
  }

  const bersihKelasBlock = document.getElementById('dash-kebersihan-per-kelas');
  const latestBersihByKelas = {};
  [...DB.kebersihan].sort((a,b)=>a.tanggal.localeCompare(b.tanggal)).forEach(r=>{ latestBersihByKelas[r.kelas] = r; });
  const bersihEntries = Object.values(latestBersihByKelas).sort((a,b)=>b.skor-a.skor);
  bersihKelasBlock.innerHTML = bersihEntries.length===0 ? emptyState('Belum ada penilaian kebersihan.') : bersihEntries.map(r=>`
      <div class="progress-row"><div class="p-label">${escapeHtml(r.kelas)}</div>
        <div class="progress-track"><div class="progress-fill" style="width:${r.skor}%; background:${r.skor>=80?'var(--success)':r.skor>=50?'var(--warn)':'var(--danger)'}"></div></div>
        <div class="p-val">${r.skor}%</div></div>`).join('');

  const topBlock = document.getElementById('dash-top-siswa');
  if(topSiswa.length===0){
    topBlock.innerHTML = emptyState('Belum ada cukup data absensi untuk menentukan peringkat.');
  }else{
    const medalColors = ['#D4A017','#9CA3AF','#B87333'];
    topBlock.innerHTML = topSiswa.map((s,i)=>`
      <div class="rank-row"><div class="rank-medal" style="${i<3?`background:${medalColors[i]}22; color:${medalColors[i]};`:''}">${i<3?ICONS.trophy:(i+1)}</div>
        <div class="rank-info"><div class="rank-name">${escapeHtml(s.nama)}</div><div class="rank-sub">${escapeHtml(s.kelas)} &bull; ${s.total} catatan</div></div>
        <div class="rank-bar-wrap"><div class="progress-track" style="width:90px;"><div class="progress-fill" style="width:${s.pct}%; background:var(--success);"></div></div></div>
        <div class="rank-pct">${s.pct}%</div></div>`).join('');
  }

  const perhatianBlock = document.getElementById('dash-perhatian');
  perhatianBlock.innerHTML = siswaPerhatian.length===0 ? emptyState('Tidak ada siswa yang perlu perhatian khusus saat ini. 👍') : siswaPerhatian.slice(0,6).map(s=>`
      <div class="attention-row"><div class="attention-avatar">${initials(s.nama)}</div>
        <div class="attention-info"><div class="attention-name">${escapeHtml(s.nama)}</div><div class="attention-sub">${escapeHtml(s.kelas)}</div></div>
        <div class="attention-badges">${s.reasons.map(r=>`<span class="pill ${r.type==='kehadiran'?'pill-amber':'pill-red'}">${r.type==='kehadiran'?ICONS.kehadiran:ICONS.disiplin} ${r.text}</span>`).join('')}</div></div>`).join('');

  const tugasBlock = document.getElementById('dash-tugas');
  if(tugasPending.length===0){
    tugasBlock.innerHTML = emptyState('Tidak ada catatan tugas yang belum selesai. Semua sudah beres! ✅');
  }else{
    tugasBlock.innerHTML = tugasPending.slice(0,6).map(t=>{
      const overdue = t.deadline && t.deadline < today;
      return `<div class="tugas-row"><button class="tugas-check" data-id="${t.id}" title="Tandai selesai">${ICONS.circleDot}</button>
        <div class="tugas-info"><div class="tugas-title">${escapeHtml(t.judul)}</div><div class="tugas-sub">${escapeHtml(t.guru)}${t.kelas?' &bull; '+escapeHtml(t.kelas):''}${t.deadline?' &bull; Tenggat '+formatDateShort(t.deadline):''}</div></div>
        <span class="pill ${t.prioritas==='Tinggi'?'pill-red':t.prioritas==='Sedang'?'pill-amber':'pill-gray'}">${escapeHtml(t.prioritas||'Biasa')}</span>
        ${overdue?`<span class="pill pill-red">${ICONS.warningTriangle} Lewat tenggat</span>`:''}</div>`;
    }).join('');
    tugasBlock.querySelectorAll('.tugas-check').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const t = DB.tugas.find(x=>x.id===btn.dataset.id);
        if(t){ const updated={...t, status:'Selesai'}; await upsertRecord('tugas', updated, true, renderDashboard); toast('Tugas ditandai selesai', 'success'); if(!firebaseReady) renderDashboard(); }
      });
    });
  }

  if(!isGuru){
    const recentBlock = document.getElementById('dash-recent');
    const allRecent = [
      ...DB.kehadiran.filter(r=>r.siswaId).map(r=>({...r, _type:'Kehadiran', _desc:`Absensi kelas ${r.kelas}`, _icon:ICONS.kehadiran})),
      ...DB.kedisiplinan.map(r=>({...r, _type:'Kedisiplinan', _desc:`${r.namaSiswa} - ${r.jenis}`, _icon:ICONS.disiplin})),
      ...DB.kebersihan.map(r=>({...r, _type:'Kebersihan', _desc:`Kelas ${r.kelas} - skor ${r.skor}%`, _icon:ICONS.bersih})),
      ...groupKehadiranSesi(DB.kehadiran.filter(r=>r.siswaId)).filter(r=>r.namaGuru).map(r=>({...r, _type:'Kehadiran Guru', _desc:`${r.namaGuru} - ${r.mapel} (${r.kelas}) - ${r.materi?'Mengajar':'Tanpa Materi'}`, _icon:ICONS.mengajar})),
    ].sort((a,b)=> (b.tanggal||'').localeCompare(a.tanggal||'') || (b.id||'').localeCompare(a.id||'')).slice(0,8);
    recentBlock.innerHTML = allRecent.length===0 ? emptyState('Belum ada aktivitas yang tercatat.') : `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Modul</th><th>Keterangan</th></tr></thead><tbody>
      ${allRecent.map(r=>`<tr><td>${formatDateShort(r.tanggal)}</td><td><span class="pill pill-gray">${r._icon} ${r._type}</span></td><td>${escapeHtml(r._desc)}</td></tr>`).join('')}
    </tbody></table></div>`;
  }
}

/* ================= DATA SISWA (tab: Data Siswa / Nilai Siswa) ================= */
function renderSiswa(){
  const content = document.getElementById('content');
  content.innerHTML = `
    <div class="card">
      <div class="card-head">
        <div class="flex items-center gap-8"><span class="card-icon-badge">${ICONS.siswa}</span><div><h3>Data Siswa</h3><div class="card-sub">${DB.siswa.length} siswa terdaftar</div></div></div>
      </div>
      <div id="siswa-tab-body"></div>
    </div>
  `;
  renderSiswaDataTab();
}
function renderSiswaDataTab(){
  const body = document.getElementById('siswa-tab-body');
  body.innerHTML = `
    <div class="flex justify-between items-center gap-8" style="flex-wrap:wrap; margin-bottom:14px;">
      <div></div>
      <div class="flex gap-8">
        <button class="btn btn-outline btn-sm" id="btn-sync-siswa">${ICONS.cloud} Kirim ke Sheet</button>
        <button class="btn btn-primary btn-sm" id="btn-add-siswa">${ICONS.plus} Tambah Siswa</button>
      </div>
    </div>
    <div class="toolbar">
      <input class="search-input" id="siswa-search" placeholder="Cari nama atau NIS..."/>
      <select class="select-input" id="siswa-filter-kelas"><option value="">Semua Kelas</option>${KELAS_LIST.map(k=>`<option value="${k}">${k}</option>`).join('')}</select>
    </div>
    <div id="siswa-table"></div>
  `;
  document.getElementById('btn-add-siswa').addEventListener('click', ()=>openSiswaForm());
  document.getElementById('btn-sync-siswa').addEventListener('click', ()=>syncToSheet('Data Siswa', DB.siswa.map(s=>({NIS:s.nis, Nama:s.nama, Kelas:s.kelas, 'Jenis Kelamin':s.jk==='L'?'Laki-laki':'Perempuan', 'No HP Ortu':s.hp, Alamat:s.alamat}))));
  document.getElementById('siswa-search').addEventListener('input', drawSiswaTable);
  document.getElementById('siswa-filter-kelas').addEventListener('change', drawSiswaTable);
  drawSiswaTable();
}
function drawSiswaTable(){
  const q = (document.getElementById('siswa-search').value||'').toLowerCase();
  const kelas = document.getElementById('siswa-filter-kelas').value;
  let list = DB.siswa.filter(s=> (s.nama.toLowerCase().includes(q) || s.nis.includes(q)) && (!kelas || s.kelas===kelas));
  const wrap = document.getElementById('siswa-table');
  if(list.length===0){ wrap.innerHTML = emptyState('Tidak ada data siswa yang cocok.'); return; }
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>JK</th><th>No HP Ortu</th><th></th></tr></thead><tbody>
    ${list.map(s=>`<tr>
      <td>${escapeHtml(s.nis)}</td><td>${escapeHtml(s.nama)}</td>
      <td><span class="pill pill-gray">${escapeHtml(s.kelas)}</span></td>
      <td>${s.jk==='L'?'L':'P'}</td><td>${escapeHtml(s.hp||'-')}</td>
      <td><div class="row-actions">
        <button class="btn-icon btn-edit-siswa" data-id="${s.id}">${ICONS.edit}</button>
        <button class="btn-icon btn-del-siswa" data-id="${s.id}">${ICONS.trash}</button>
      </div></td></tr>`).join('')}
  </tbody></table></div>`;
  wrap.querySelectorAll('.btn-edit-siswa').forEach(b=>b.addEventListener('click', ()=>openSiswaForm(DB.siswa.find(s=>s.id===b.dataset.id))));
  wrap.querySelectorAll('.btn-del-siswa').forEach(b=>b.addEventListener('click', async ()=>{
    if(confirm('Hapus data siswa ini?')){
      await removeRecord('siswa', b.dataset.id, drawSiswaTable);
      if(!firebaseReady) drawSiswaTable();
      toast('Data siswa dihapus', 'success');
    }
  }));
}
function openSiswaForm(existing){
  const isEdit = !!existing;
  openModal(`
    <div class="modal-head"><h3>${isEdit?'Edit':'Tambah'} Data Siswa</h3><button class="btn-icon" onclick="closeModal()">${ICONS.close}</button></div>
    <form id="siswa-form">
      <div class="modal-body"><div class="form-grid">
        <div class="field"><label>NIS</label><input required id="f-nis" value="${isEdit?escapeHtml(existing.nis):''}"/></div>
        <div class="field"><label>Kelas</label><select required id="f-kelas">${KELAS_LIST.map(k=>`<option value="${k}" ${isEdit&&existing.kelas===k?'selected':''}>${k}</option>`).join('')}</select></div>
        <div class="field full"><label>Nama Lengkap</label><input required id="f-nama" value="${isEdit?escapeHtml(existing.nama):''}"/></div>
        <div class="field"><label>Jenis Kelamin</label><select id="f-jk"><option value="L" ${isEdit&&existing.jk==='L'?'selected':''}>Laki-laki</option><option value="P" ${isEdit&&existing.jk==='P'?'selected':''}>Perempuan</option></select></div>
        <div class="field"><label>No HP Orang Tua</label><input id="f-hp" value="${isEdit?escapeHtml(existing.hp):''}"/></div>
        <div class="field full"><label>Alamat</label><input id="f-alamat" value="${isEdit?escapeHtml(existing.alamat):''}"/></div>
      </div></div>
      <div class="modal-foot">

/* Input nilai satu kelas sekaligus (mirip form Kehadiran Siswa) */
function drawNilaiMassalTable(){
  const kelas = document.getElementById('nm-kelas').value;
  const mapel = document.getElementById('nm-mapel').value;
  const jenis = document.getElementById('nm-jenis').value;
  const semester = document.getElementById('nm-semester').value;
  const tahun = document.getElementById('nm-tahun').value;
  const tanggal = document.getElementById('nm-tanggal').value || todayStr();
  const wrap = document.getElementById('nilai-massal-table');
  if(!kelas){ wrap.innerHTML = emptyState('Pilih kelas untuk mulai input nilai satu kelas sekaligus.'); return; }
  if(!mapel){ wrap.innerHTML = emptyState('Tambahkan data mata pelajaran terlebih dahulu di tab Mata Pelajaran pada menu Data Guru.'); return; }
  const siswaKelas = DB.siswa.filter(s=>s.kelas===kelas);
  if(siswaKelas.length===0){ wrap.innerHTML = emptyState('Belum ada siswa terdaftar di kelas ini.'); return; }
  const existingMap = {};
  DB.nilai.filter(n=> n.kelas===kelas && n.mapel===mapel && n.jenis===jenis && n.semester===semester && n.tahunAjaran===tahun && n.tanggal===tanggal)
    .forEach(n=> existingMap[n.siswaId] = n);
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Nama</th><th>NIS</th><th>Nilai (0-100)</th><th>Keterangan</th></tr></thead><tbody>
    ${siswaKelas.map(s=>{
      const ex = existingMap[s.id];
      return `<tr><td>${escapeHtml(s.nama)}</td><td>${escapeHtml(s.nis||'-')}</td>
        <td><input type="number" min="0" max="100" class="search-input nm-nilai" data-sid="${s.id}" value="${ex?ex.nilai:''}" placeholder="-"/></td>
        <td><input class="search-input nm-ket" data-sid="${s.id}" value="${ex?escapeHtml(ex.keterangan||''):''}" placeholder="opsional"/></td></tr>`;
    }).join('')}
  </tbody></table></div>
  <div style="margin-top:16px; text-align:right;"><button class="btn btn-primary" id="btn-save-nilai-massal">Simpan Semua Nilai Kelas ${escapeHtml(kelas)}</button></div>`;

  document.getElementById('btn-save-nilai-massal').addEventListener('click', async ()=>{
    const removeIds = DB.nilai.filter(n=> n.kelas===kelas && n.mapel===mapel && n.jenis===jenis && n.semester===semester && n.tahunAjaran===tahun && n.tanggal===tanggal).map(n=>n.id);
    const newRecords = [];
    siswaKelas.forEach(s=>{
      const nilaiInput = wrap.querySelector(`.nm-nilai[data-sid="${s.id}"]`);
      const val = nilaiInput.value;
      if(val===''){ return; } // siswa yang dikosongkan dianggap belum dinilai, tidak disimpan
      const ket = wrap.querySelector(`.nm-ket[data-sid="${s.id}"]`).value.trim();
      newRecords.push({
        id: uid(), siswaId: s.id, nama: s.nama, nis: s.nis, kelas: s.kelas,
        mapel, jenis, nilai: Math.max(0, Math.min(100, Number(val)||0)),
        tanggal, semester, tahunAjaran: tahun, keterangan: ket,
      });
    });
    if(newRecords.length===0){ toast('Belum ada nilai yang diisi', 'error'); return; }
    await bulkUpsert('nilai', newRecords, removeIds, null);
    if(!firebaseReady){ drawNilaiMassalTable(); drawNilaiTable(); }
    toast(newRecords.length+' nilai siswa kelas '+kelas+' tersimpan', 'success');
  });
}

    wrap.querySelectorAll('.btn-edit-nilai').forEach(b=>b.addEventListener('click', ()=>openNilaiForm(DB.nilai.find(n=>n.id===b.dataset.id))));

/* Menghitung nilai akhir per siswa: rata-rata dari tiap jenis nilai yang tersedia
   (bila ada beberapa nilai harian/tugas, dirata-rata dahulu per jenis, baru digabung). */
function computeRataNilaiSiswa(f){
  const list = DB.nilai.filter(n=>
    (!f.kelas || n.kelas===f.kelas) && (!f.mapel || n.mapel===f.mapel) &&
    (!f.semester || n.semester===f.semester) && (!f.tahun || n.tahunAjaran===f.tahun)
  );
  const bySiswa = {};
  list.forEach(n=>{
    const key = n.siswaId || n.nama;
    if(!bySiswa[key]) bySiswa[key] = {siswaId:n.siswaId, nama:n.nama, kelas:n.kelas, byJenis:{}};
    if(!bySiswa[key].byJenis[n.jenis]) bySiswa[key].byJenis[n.jenis] = [];
    bySiswa[key].byJenis[n.jenis].push(Number(n.nilai)||0);
  });
  return Object.values(bySiswa).map(v=>{
    const jenisAverages = Object.values(v.byJenis).map(arr=> arr.reduce((a,b)=>a+b,0)/arr.length);
    const rata = jenisAverages.length ? Math.round((jenisAverages.reduce((a,b)=>a+b,0)/jenisAverages.length)*10)/10 : 0;
    const jumlahEntri = Object.values(v.byJenis).reduce((a,arr)=>a+arr.length,0);
    return {...v, rata, jumlahEntri};
  }).sort((a,b)=> b.rata-a.rata);
}
function drawNilaiRataTable(f){
  const wrap = document.getElementById('nilai-rata-table');
  const rows = computeRataNilaiSiswa(f);
  if(rows.length===0){ wrap.innerHTML = emptyState('Belum ada nilai untuk dihitung rata-ratanya sesuai filter di atas.'); return; }
  const medalColors = ['#D4A017','#9CA3AF','#B87333'];
  wrap.innerHTML = rows.map((r,i)=>`
    <div class="rank-row">
      <div class="rank-medal" style="${i<3?`background:${medalColors[i]}22; color:${medalColors[i]};`:''}">${i<3?ICONS.trophy:(i+1)}</div>
      <div class="rank-info"><div class="rank-name">${escapeHtml(r.nama)}</div><div class="rank-sub">${escapeHtml(r.kelas)} &bull; ${r.jumlahEntri} entri nilai</div></div>
      <div class="rank-pct" style="width:auto; font-size:16px; font-family:var(--font-display); font-weight:800; color:${r.rata>=75?'var(--success)':r.rata>=60?'var(--warn)':'var(--danger)'};">${r.rata}</div>
    </div>`).join('');
}

        <div class="field"><label>Nilai (0-100)</label><input required type="number" min="0" max="100" id="f-nilai-angka" value="${isEdit?existing.nilai:''}"/></div>

      return `<tr>
        <td>${escapeHtml(m.nama)}</td>

        </div></td></tr>`;
    }).join('')}
  </tbody></table></div>`;
  wrap.querySelectorAll('.btn-edit-mapel').forEach(b=>b.addEventListener('click', async ()=>{
    const m = DB.mapel.find(x=>x.id===b.dataset.id);

    if(namaBaru===null) return;

  }));
  wrap.querySelectorAll('.btn-del-mapel').forEach(b=>b.addEventListener('click', async ()=>{
    const m = DB.mapel.find(x=>x.id===b.dataset.id);
    const jumlahGuru = DB.guru.filter(g=> guruMapelArr(g).includes(m.nama)).length;
    const jumlahNilai = DB.nilai.filter(n=> n.mapel===m.nama).length;
    const pesan = (jumlahGuru>0 || jumlahNilai>0)

      if(!firebaseReady) drawMapelList();

  }));
}

/* ---------------- Sinkronisasi ringkasan per-siswa (untuk dashboard pribadi siswa) ---------------- */
async function syncSiswaRingkasan(siswaId){
  if(!firebaseReady || !siswaId) return;
  const siswa = DB.siswa.find(s=>s.id===siswaId);
  if(!siswa) return;
  const kehadiranSiswa = DB.kehadiran.filter(r=>r.siswaId===siswaId);
  const hadir = kehadiranSiswa.filter(r=>r.status==='Hadir').length;
  const pct = kehadiranSiswa.length ? Math.round(hadir/kehadiranSiswa.length*100) : null;
  const pelanggaran = DB.kedisiplinan.filter(r=>r.siswaId===siswaId);
  const totalPoin = pelanggaran.reduce((a,b)=>a+(Number(b.poin)||0),0);
  const recent = [...pelanggaran].sort((a,b)=>b.tanggal.localeCompare(a.tanggal)).slice(0,5).map(p=>({tanggal:p.tanggal, jenis:p.jenis, poin:p.poin}));
  try{
    await firebaseDB.ref('siswa_ringkasan/'+siswaId).set({
      nama: siswa.nama, nis: siswa.nis, kelas: siswa.kelas,
      kehadiranPct: pct, totalCatatanKehadiran: kehadiranSiswa.length,
      totalPoinPelanggaran: totalPoin, pelanggaranTerakhir: recent,
      updatedAt: new Date().toISOString(),
    });
  }catch(e){ console.error('gagal sinkron ringkasan siswa', e); }
}

/* Tabel nama siswa lengkap beserta rekap kehadirannya (Hadir/Sakit/Izin/Alpa/Persentase) */
function drawKehadiranRekapSiswaTable(){
  const q = (document.getElementById('kh-rekap-search').value||'').toLowerCase();

  const wrap = document.getElementById('kh-rekap-table');
  const list = DB.siswa.filter(s=> (s.nama.toLowerCase().includes(q) || s.nis.includes(q)) && (!kelas || s.kelas===kelas));
  if(list.length===0){ wrap.innerHTML = emptyState('Tidak ada data siswa yang cocok.'); return; }
  const rekap = {};
  DB.kehadiran.filter(r=>r.siswaId).forEach(r=>{
    if(!rekap[r.siswaId]) rekap[r.siswaId] = {Hadir:0, Sakit:0, Izin:0, Alpa:0, total:0};
    if(rekap[r.siswaId][r.status]!==undefined) rekap[r.siswaId][r.status]++;
    rekap[r.siswaId].total++;
  });
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>NIS</th><th>Nama</th><th>Kelas</th><th>Hadir</th><th>Sakit</th><th>Izin</th><th>Alpa</th><th>Persentase</th></tr></thead><tbody>
    ${list.map(s=>{
      const r = rekap[s.id] || {Hadir:0, Sakit:0, Izin:0, Alpa:0, total:0};
      const pct = r.total ? Math.round(r.Hadir/r.total*100) : null;
      return `<tr>

        <td>${r.Hadir}</td><td>${r.Sakit}</td><td>${r.Izin}</td><td>${r.Alpa}</td>
        <td>${pct===null?'-':`<span class="pill ${pct>=85?'pill-green':pct>=60?'pill-amber':'pill-red'}">${pct}%</span>`}</td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
}

/* Mengelompokkan catatan kehadiran siswa menjadi sesi mengajar (tanggal+kelas+rentang jam+guru),
   dipakai sebagai riwayat kehadiran sekaligus penilaian kehadiran guru mengajar di kelas. */
function groupKehadiranSesi(list){
  const grouped = {};
  list.forEach(r=>{
    const jkm = Number(r.jamKeMulai||r.jamKe||1);
    const jks = Number(r.jamKeSelesai||r.jamKe||1);
    const key = r.tanggal+'|'+r.kelas+'|'+jkm+'|'+jks;
    if(!grouped[key]) grouped[key] = {tanggal:r.tanggal, kelas:r.kelas, jamKeMulai:jkm, jamKeSelesai:jks, namaGuru:r.namaGuru||'', mapel:r.mapel||'', materi:r.materi||'', hadir:0, total:0};
    grouped[key].total++;
    if(r.status==='Hadir') grouped[key].hadir++;
  });
  return Object.values(grouped);
}
function drawKehadiranHistory(){
  const wrap = document.getElementById('kh-history');
  const rows = groupKehadiranSesi(DB.kehadiran.filter(r=>r.siswaId))
    .sort((a,b)=> b.tanggal.localeCompare(a.tanggal) || b.jamKeMulai-a.jamKeMulai);
  if(rows.length===0){ wrap.innerHTML = emptyState('Belum ada riwayat kehadiran.'); return; }
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kelas</th><th>Jam Ke</th><th>Guru</th><th>Mapel</th><th>Materi</th><th>Hadir</th><th>Persentase</th><th>Status Guru</th></tr></thead><tbody>
    ${rows.map(r=>{
      const pct = Math.round(r.hadir/r.total*100);
      const jamLabel = r.jamKeMulai===r.jamKeSelesai ? ('Ke-'+r.jamKeMulai) : ('Ke-'+r.jamKeMulai+' s.d. '+r.jamKeSelesai);
      const guruStatus = !r.namaGuru ? {label:'Belum Diisi', cls:'pill-gray'} : (r.materi ? {label:'Mengajar', cls:'pill-green'} : {label:'Tanpa Materi', cls:'pill-amber'});
      return `<tr><td>${formatDateShort(r.tanggal)}</td><td><span class="pill pill-gray">${r.kelas}</span></td><td>${jamLabel}</td><td>${escapeHtml(r.namaGuru||'-')}</td><td>${escapeHtml(r.mapel||'-')}</td><td>${escapeHtml(r.materi||'-')}</td><td>${r.hadir}/${r.total}</td><td><span class="pill ${pct>=85?'pill-green':pct>=60?'pill-amber':'pill-red'}">${pct}%</span></td><td><span class="pill ${guruStatus.cls}">${guruStatus.label}</span></td></tr>`;
    }).join('')}
  </tbody></table></div>`;
}

function drawKehadiranGuruForm(){
  const tanggal = document.getElementById('kg-tanggal').value;
  const kelas = document.getElementById('kg-kelas').value;
  const jamKe = Number(document.getElementById('kg-jamke').value)||1;
  const area = document.getElementById('kg-form-area');
  if(!kelas){ area.innerHTML = emptyState('Pilih kelas terlebih dahulu.'); return; }
  const totalSiswa = DB.siswa.filter(s=>s.kelas===kelas).length;
  const existing = DB.kehadiran.find(r=> !r.siswaId && r.tanggal===tanggal && r.kelas===kelas && Number(r.jamKe||1)===jamKe);
  // Bila akun guru ini sudah terhubung ke data guru, otomatis pakai nama & mapel guru tsb sebagai guru pengajar jam ini
  const linkedGuru = currentUser.guruId ? DB.guru.find(g=>g.id===currentUser.guruId) : null;
  const linkedGuruMapel = guruMapelArr(linkedGuru);
  area.innerHTML = `
    <div class="form-grid">
      ${linkedGuru
        ? `<div class="field"><label>Guru Pengajar</label><input value="${escapeHtml(linkedGuru.nama)}" disabled style="opacity:.7;"/></div>
           <div class="field"><label>Mata Pelajaran</label><select id="kg-mapel">${linkedGuruMapel.map(m=>`<option value="${escapeHtml(m)}" ${existing&&existing.mapel===m?'selected':''}>${escapeHtml(m)}</option>`).join('') || '<option value="">-</option>'}</select></div>`
        : `<div class="field"><label>Guru Pengajar</label><select id="kg-guru"><option value="">- Pilih Guru -</option>${DB.guru.map(g=>`<option value="${g.id}" ${existing&&existing.guruId===g.id?'selected':''}>${escapeHtml(g.nama)} — ${escapeHtml(guruMapelDisplay(g))}</option>`).join('') || '<option value="">Belum ada data guru</option>'}</select></div>
           <div class="field"><label>Mata Pelajaran</label><select id="kg-mapel">${existing&&existing.guruId ? guruMapelArr(DB.guru.find(g=>g.id===existing.guruId)).map(m=>`<option value="${escapeHtml(m)}" ${existing.mapel===m?'selected':''}>${escapeHtml(m)}</option>`).join('') : '<option value="">- Pilih guru terlebih dahulu -</option>'}</select></div>`
      }
      <div class="field"><label>Jumlah Siswa Terdaftar</label><input type="number" id="kg-total" value="${existing?existing.jumlahTotal:totalSiswa}"/></div>
      <div class="field"><label>Jumlah Hadir</label><input type="number" min="0" id="kg-hadir" value="${existing?existing.jumlahHadir:''}" placeholder="Contoh: 30"/></div>
      <div class="field full"><label>Materi yang Diajarkan</label><input id="kg-materi" placeholder="Contoh: Persamaan Kuadrat" value="${existing?escapeHtml(existing.materi||''):''}"/></div>
      <div class="field full"><label>Keterangan (opsional)</label><textarea id="kg-ket" rows="2" placeholder="Contoh: 2 siswa izin, 1 sakit">${existing?escapeHtml(existing.keterangan||''):''}</textarea></div>
    </div>
    <div style="margin-top:16px; text-align:right;"><button class="btn btn-primary" id="btn-save-kg">Simpan Laporan</button></div>
  `;
  if(!linkedGuru){
    const guruSel = document.getElementById('kg-guru');
    guruSel.addEventListener('change', e=>{
      const guru = DB.guru.find(g=>g.id===e.target.value);
      const arr = guruMapelArr(guru);
      document.getElementById('kg-mapel').innerHTML = arr.length ? arr.map(m=>`<option value="${escapeHtml(m)}">${escapeHtml(m)}</option>`).join('') : '<option value="">-</option>';
    });
  }
  document.getElementById('btn-save-kg').addEventListener('click', async ()=>{
    const hadir = document.getElementById('kg-hadir').value;
    if(hadir===''){ toast('Isi jumlah siswa hadir terlebih dahulu', 'error'); return; }
    const guru = linkedGuru || DB.guru.find(g=>g.id===document.getElementById('kg-guru').value);
    const mapel = document.getElementById('kg-mapel').value.trim();
    const data = {
      id: existing?existing.id:uid(), tanggal, kelas, jamKe,
      guruId: guru?guru.id:null, namaGuru: guru?guru.nama:'', mapel,
      materi: document.getElementById('kg-materi').value.trim(),
      jumlahHadir: Number(hadir), jumlahTotal: Number(document.getElementById('kg-total').value)||totalSiswa,
      keterangan: document.getElementById('kg-ket').value.trim(),
      inputOleh: currentUser.name,
    };
    await upsertRecord('kehadiran', data, !!existing, drawKehadiranGuruHistory);
    toast('Laporan kehadiran kelas '+kelas+' jam ke-'+jamKe+' tersimpan', 'success');
    if(!firebaseReady) drawKehadiranGuruHistory();
  });
}
function drawKehadiranGuruHistory(){
  const wrap = document.getElementById('kg-history');
  const rows = [...DB.kehadiran].filter(r=>!r.siswaId).sort((a,b)=> b.tanggal.localeCompare(a.tanggal) || Number(b.jamKe||1)-Number(a.jamKe||1));
  if(rows.length===0){ wrap.innerHTML = emptyState('Belum ada laporan kehadiran yang diinput.'); return; }
  wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Tanggal</th><th>Kelas</th><th>Jam Ke</th><th>Guru</th><th>Mapel</th><th>Materi</th><th>Hadir</th><th>Persentase</th></tr></thead><tbody>
    ${rows.map(r=>{
      const pct = r.jumlahTotal? Math.round(r.jumlahHadir/r.jumlahTotal*100) : 0;
      return `<tr><td>${formatDateShort(r.tanggal)}</td><td><span class="pill pill-gray">${escapeHtml(r.kelas)}</span></td><td>Ke-${r.jamKe||1}</td><td>${escapeHtml(r.namaGuru||'-')}</td><td>${escapeHtml(r.mapel||'-')}</td><td>${escapeHtml(r.materi||'-')}</td><td>${r.jumlahHadir}/${r.jumlahTotal}</td><td><span class="pill ${pct>=85?'pill-green':pct>=60?'pill-amber':'pill-red'}">${pct}%</span></td></tr>`;
    }).join('')}
  </tbody></table></div>`;
}

        </div></td></tr>`;
    }).join('')}
  </tbody></table></div>`;
  wrap.querySelectorAll('.btn-edit-tugas').forEach(b=>b.addEventListener('click', ()=>openTugasForm(DB.tugas.find(t=>t.id===b.dataset.id), drawTugasTable)));
  wrap.querySelectorAll('.btn-del-tugas').forEach(b=>b.addEventListener('click', async ()=>{

      <div class="storage-note">${ICONS.wifiOff}<div>Fitur ini hanya aktif pada <b>Mode Online</b>. Hubungkan aplikasi ke Firebase terlebih dahulu di halaman <b>Pengaturan &rarr; Database Online</b>.</div></div>

  content.innerHTML = `

async function loadAndDrawUsers(){
  const wrap = document.getElementById('user-table');
  try{
    const snap = await firebaseDB.ref('users').once('value');
    const val = snap.val() || {};
    const list = Object.keys(val).map(uidKey=>({uid:uidKey, ...val[uidKey]}));
    if(list.length===0){ wrap.innerHTML = emptyState('Belum ada akun pengguna selain admin pertama.'); return; }
    wrap.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Nama</th><th>Email</th><th>Peran</th><th>Terhubung ke</th><th>Akses Menu</th><th></th></tr></thead><tbody>
      ${list.map(u=>{
        const roleColor = u.role==='admin'?'pill-red':u.role==='guru'?'pill-amber':'pill-green';
        const link = u.role==='guru' ? (DB.guru.find(g=>g.id===u.guruId)?.nama || '-') : u.role==='siswa' ? (DB.siswa.find(s=>s.id===u.siswaId)?.nama || '-') : '-';
        const isSelf = u.uid===currentUser.uid;
        const hasCustomPerms = Array.isArray(u.perms) && u.perms.length>0;
        const permInfo = hasCustomPerms ? `<span class="pill pill-gray" title="${u.perms.map(k=>ALL_NAV_ITEMS.find(n=>n.key===k)?.label||k).join(', ')}">Kustom (${u.perms.length} menu)</span>` : `<span class="pill pill-gray">Sesuai Peran</span>`;
        return `<tr><td>${escapeHtml(u.name||'-')}${isSelf?' <span class="pill pill-gray">Anda</span>':''}</td><td>${escapeHtml(u.email||'-')}</td>
          <td><span class="pill ${roleColor}">${u.role}</span></td><td>${escapeHtml(link)}</td>
          <td>${permInfo}</td>
          <td><div class="row-actions">
            <button class="btn-icon btn-edit-user" data-uid="${u.uid}" title="Atur akses (ubah peran/keterkaitan)">${ICONS.edit}</button>
            <button class="btn-icon btn-reset-user" data-email="${escapeHtml(u.email||'')}" title="Kirim email reset password">${ICONS.key}</button>
            ${!isSelf?`<button class="btn-icon btn-del-user" data-uid="${u.uid}" title="Cabut akses">${ICONS.trash}</button>`:''}
          </div></td></tr>`;
      }).join('')}
    </tbody></table></div>
    <p style="font-size:11.5px; color:var(--muted); margin-top:12px;">Tombol hapus hanya mencabut profil/akses pengguna di aplikasi. Untuk menghapus akun login sepenuhnya, hapus manual di Firebase Console &rarr; Authentication.</p>`;
    wrap.querySelectorAll('.btn-edit-user').forEach(b=>b.addEventListener('click', ()=>{
      const u = list.find(x=>x.uid===b.dataset.uid);
      if(u) openUserForm(u);
    }));
    wrap.querySelectorAll('.btn-reset-user').forEach(b=>b.addEventListener('click', async ()=>{
      const email = b.dataset.email;
      if(!email){ toast('Pengguna ini tidak memiliki email tercatat', 'error'); return; }
      if(!confirm('Kirim email reset password ke '+email+'?')) return;
      try{
        await firebaseAuth.sendPasswordResetEmail(email);
        toast('Email reset password dikirim ke '+email, 'success');
      }catch(ex){
        toast('Gagal mengirim: '+(ex.message||'terjadi kesalahan'), 'error');
      }
    }));
    wrap.querySelectorAll('.btn-del-user').forEach(b=>b.addEventListener('click', async ()=>{
      if(confirm('Cabut akses pengguna ini dari aplikasi?')){
        await firebaseDB.ref('users/'+b.dataset.uid).remove();
        toast('Akses pengguna dicabut', 'success');
        loadAndDrawUsers();
      }
    }));
  }catch(e){
    wrap.innerHTML = emptyState('Gagal memuat daftar pengguna. Periksa aturan keamanan Firebase.');
  }
}

  openModal(`
    <div class="modal-head"><h3>${isEdit?'Atur Akses Pengguna':'Buat Akun Baru'}</h3><button class="btn-icon" onclick="closeModal()">${ICONS.close}</button></div>
    <form id="user-form">
      <div class="modal-body"><div class="form-grid">

          : `<div class="field"><label>Email</label><input type="email" required id="f-email"/></div>

        }
