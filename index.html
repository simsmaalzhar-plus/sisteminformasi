          <select id="f-role">
            <option value="guru" ${isEdit&&existing.role==='guru'?'selected':''}>Guru — input kehadiran &amp; catatan tugas</option>
            <option value="siswa" ${isEdit&&existing.role==='siswa'?'selected':''}>Siswa — hanya melihat pencapaian pribadi</option>
            <option value="admin" ${isEdit&&existing.role==='admin'?'selected':''}>Admin — akses penuh</option>
          </select>
        </div>
        <div class="field full" id="link-guru-wrap"><label>Hubungkan ke Data Guru</label><select id="f-guru-link"><option value="">-</option>${DB.guru.map(g=>`<option value="${g.id}" ${isEdit&&existing.guruId===g.id?'selected':''}>${escapeHtml(g.nama)}</option>`).join('')}</select></div>
        <div class="field full hidden" id="link-siswa-wrap"><label>Hubungkan ke Data Siswa</label><select id="f-siswa-link"><option value="">-</option>${DB.siswa.map(s=>`<option value="${s.id}" ${isEdit&&existing.siswaId===s.id?'selected':''}>${escapeHtml(s.nama)} (${escapeHtml(s.kelas)})</option>`).join('')}</select></div>
        <div class="field full">
          <label>Hak Akses Menu</label>
          <div class="card-sub" style="margin-bottom:8px;">Pilih menu mana saja yang boleh diakses akun ini. Kosongkan / pakai "Sesuai Peran Default" bila ingin mengikuti akses bawaan peran di atas.</div>
          <div class="flex gap-8" style="flex-wrap:wrap; margin-bottom:10px;">
            <button type="button" class="btn btn-outline btn-sm" id="btn-perm-all">${ICONS.shield} Akses Penuh (Semua Menu)</button>
            <button type="button" class="btn btn-outline btn-sm" id="btn-perm-default">Sesuai Peran Default</button>
            <button type="button" class="btn btn-outline btn-sm" id="btn-perm-none">Kosongkan</button>
          </div>
          <div id="perm-grid" style="display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:8px 14px; background:#FBFAF6; border:1px solid var(--border); border-radius:10px; padding:12px 14px;">
            ${ALL_NAV_ITEMS.map(n=>`<label style="display:flex; align-items:center; gap:7px; font-size:13px; font-weight:500; cursor:pointer;">
              <input type="checkbox" class="f-perm" value="${n.key}" ${isEdit&&Array.isArray(existing.perms)&&existing.perms.includes(n.key)?'checked':''}/> ${n.label}
            </label>`).join('')}
          </div>
        </div>
      </div></div>
      <div class="modal-foot">
        <button type="button" class="btn btn-outline" onclick="closeModal()">Batal</button>
        <button type="submit" class="btn btn-primary">${isEdit?'Simpan Akses':'Buat Akun'}</button>
      </div>
    </form>
  `);
  const roleSel = document.getElementById('f-role');
  function syncLinkVisibility(){
    document.getElementById('link-guru-wrap').classList.toggle('hidden', roleSel.value!=='guru');
    document.getElementById('link-siswa-wrap').classList.toggle('hidden', roleSel.value!=='siswa');
  }
  function applyDefaultPerms(){
    const defaultKeys = (NAV_BY_ROLE[roleSel.value]||[]).map(n=>n.key);
    document.querySelectorAll('.f-perm').forEach(cb=> cb.checked = defaultKeys.includes(cb.value));
  }
  roleSel.addEventListener('change', syncLinkVisibility);
  syncLinkVisibility();
  // Jika sedang mengedit dan belum ada akses kustom tersimpan, tampilkan checklist sesuai peran saat ini sebagai acuan awal
  if(!(isEdit && Array.isArray(existing.perms) && existing.perms.length>0)) applyDefaultPerms();
  document.getElementById('btn-perm-all').addEventListener('click', ()=>{
    document.querySelectorAll('.f-perm').forEach(cb=> cb.checked = true);
  });
  document.getElementById('btn-perm-default').addEventListener('click', applyDefaultPerms);
  document.getElementById('btn-perm-none').addEventListener('click', ()=>{
    document.querySelectorAll('.f-perm').forEach(cb=> cb.checked = false);
  });

  document.getElementById('user-form').addEventListener('submit', async function(e){
    e.preventDefault();
    const name = document.getElementById('f-name').value.trim();
    const role = roleSel.value;

    const selectedPerms = Array.from(document.querySelectorAll('.f-perm:checked')).map(cb=>cb.value);
    const roleDefaultKeys = (NAV_BY_ROLE[role]||[]).map(n=>n.key);
    // Simpan akses kustom hanya bila berbeda dari default peran (agar tetap fleksibel bila peran diubah nanti),
    // tetap simpan bila memang sengaja dikosongkan/berbeda sama sekali.
    const isSameAsRoleDefault = selectedPerms.length===roleDefaultKeys.length && selectedPerms.every(k=>roleDefaultKeys.includes(k));
    const permsToSave = isSameAsRoleDefault ? null : selectedPerms;

    if(isEdit){
      const profile = {name, email: existing.email||'', role};
      if(role==='guru') profile.guruId = document.getElementById('f-guru-link').value || null;
      if(role==='siswa') profile.siswaId = document.getElementById('f-siswa-link').value || null;
      profile.perms = permsToSave;
      try{
        await firebaseDB.ref('users/'+existing.uid).set(profile);
        closeModal();
        toast('Akses untuk '+name+' berhasil diperbarui', 'success');
        loadAndDrawUsers();
        if(existing.uid===currentUser.uid){
          currentUser.name = name; currentUser.role = role; currentUser.perms = profile.perms;
          document.getElementById('user-name').textContent = name;
          renderNav();
        }
      }catch(ex){
        toast('Gagal menyimpan akses: '+(ex.message||'terjadi kesalahan'), 'error');
      }
      return;
    }

    const email = document.getElementById('f-email').value.trim();
    const pass = document.getElementById('f-pass').value;
    const profile = {name, email, role};
    if(role==='guru') profile.guruId = document.getElementById('f-guru-link').value || null;
    if(role==='siswa') profile.siswaId = document.getElementById('f-siswa-link').value || null;
    profile.perms = permsToSave;
    try{
      const secondaryApp = firebase.initializeApp(firebaseApp.options, 'secondary-'+Date.now());
      const cred = await secondaryApp.auth().createUserWithEmailAndPassword(email, pass);
      const newUid = cred.user.uid;
      await firebaseDB.ref('users/'+newUid).set(profile);
      await secondaryApp.auth().signOut();
      await secondaryApp.delete();
      closeModal();
      toast('Akun untuk '+name+' berhasil dibuat', 'success');
      loadAndDrawUsers();
    }catch(ex){
      toast('Gagal membuat akun: '+(ex.message||'terjadi kesalahan'), 'error');
    }
  });
}

/* Menyimpan siswa yang sedang dipilih pada halaman Pencapaian (hanya dipakai untuk role selain siswa) */
let pencapaianSelectedId = null;

async function renderPencapaian(){
  const content = document.getElementById('content');
  const isSiswaRole = currentUser.role === 'siswa';
  // Siswa hanya boleh melihat datanya sendiri; peran lain (mis. admin/guru dengan akses halaman ini) boleh memilih siapa saja.
  const daftarSiswa = isSiswaRole
    ? DB.siswa.filter(s=>s.id===currentUser.siswaId)
    : [...DB.siswa].sort((a,b)=>a.nama.localeCompare(b.nama));

  if(daftarSiswa.length===0){
    content.innerHTML = emptyState('Data pencapaian belum tersedia. Hubungi admin sekolah.');
    return;
  }

  const selectedId = isSiswaRole
    ? currentUser.siswaId
    : (pencapaianSelectedId && daftarSiswa.some(s=>s.id===pencapaianSelectedId) ? pencapaianSelectedId : daftarSiswa[0].id);
  pencapaianSelectedId = selectedId;

  content.innerHTML = `
    <div class="card">
      <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge">${ICONS.siswa}</span><div><h3>Pilih Nama Siswa</h3><div class="card-sub">${isSiswaRole?'Halaman ini hanya menampilkan pencapaianmu sendiri':'Hanya nama siswa yang dapat diubah — data pencapaian di bawah bersifat lihat saja'}</div></div></div></div>
      <div class="field" style="max-width:360px; margin-bottom:0;">
        <label>Nama Siswa</label>
        <select id="pencapaian-siswa-select" ${isSiswaRole?'disabled':''}>
          ${daftarSiswa.map(s=>`<option value="${s.id}" ${s.id===selectedId?'selected':''}>${escapeHtml(s.nama)} (${escapeHtml(s.kelas)})</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="pencapaian-detail"></div>
  `;

  const sel = document.getElementById('pencapaian-siswa-select');
  if(sel && !isSiswaRole){
    sel.addEventListener('change', ()=>{
      pencapaianSelectedId = sel.value;
      drawPencapaianDetail(pencapaianSelectedId, isSiswaRole);
    });
  }
  drawPencapaianDetail(selectedId, isSiswaRole);
}

/* Menggambar seluruh data pencapaian (nilai, kehadiran, kedisiplinan, catatan tugas) untuk satu siswa.
   Seluruh bagian ini hanya menampilkan data (read-only), tidak ada aksi ubah/hapus. */
function drawPencapaianDetail(siswaId, isSiswaRole){
  const wrap = document.getElementById('pencapaian-detail');
  const siswa = DB.siswa.find(s=>s.id===siswaId);
  if(!siswa){ wrap.innerHTML = emptyState('Data siswa tidak ditemukan.'); return; }

  // Kehadiran
  const kh = DB.kehadiran.filter(r=>r.siswaId===siswa.id);
  const hadir = kh.filter(r=>r.status==='Hadir').length;
  const kehadiranPct = kh.length ? Math.round(hadir/kh.length*100) : null;

  // Kedisiplinan
  const kd = DB.kedisiplinan.filter(r=>r.siswaId===siswa.id);
  const poin = kd.reduce((a,b)=>a+(Number(b.poin)||0),0);
  const pelanggaranTerakhir = [...kd].sort((a,b)=>(b.tanggal||'').localeCompare(a.tanggal||'')).slice(0,5);

  // Rata-rata nilai per mata pelajaran (rata-rata tiap jenis nilai, lalu dirata-rata lagi seperti di halaman Nilai Siswa)
  const nilaiSiswa = DB.nilai.filter(n=>n.siswaId===siswa.id);
  const byMapel = {};
  nilaiSiswa.forEach(n=>{
    if(!byMapel[n.mapel]) byMapel[n.mapel] = {};
    if(!byMapel[n.mapel][n.jenis]) byMapel[n.mapel][n.jenis] = [];
    byMapel[n.mapel][n.jenis].push(Number(n.nilai)||0);
  });
  const rataPerMapel = Object.keys(byMapel).sort((a,b)=>a.localeCompare(b)).map(mapel=>{
    const jenisAverages = Object.values(byMapel[mapel]).map(arr=>arr.reduce((a,b)=>a+b,0)/arr.length);
    const rata = jenisAverages.length ? Math.round((jenisAverages.reduce((a,b)=>a+b,0)/jenisAverages.length)*10)/10 : 0;
    const jumlahEntri = Object.values(byMapel[mapel]).reduce((a,arr)=>a+arr.length,0);
    return {mapel, rata, jumlahEntri};
  });
  const rataKeseluruhan = rataPerMapel.length ? Math.round((rataPerMapel.reduce((a,b)=>a+b.rata,0)/rataPerMapel.length)*10)/10 : null;

  // Catatan tugas untuk kelas siswa ini
  const tugasKelas = [...DB.tugas].filter(t=>t.kelas===siswa.kelas).sort((a,b)=>(a.deadline||'').localeCompare(b.deadline||''));

  wrap.innerHTML = `
    <div class="card" style="text-align:center; padding:32px 20px;">
      <div class="user-avatar" style="width:64px; height:64px; font-size:22px; margin:0 auto 14px; background:var(--accent);">${initials(siswa.nama)}</div>
      <h2 style="font-family:var(--font-display); font-size:20px;">${escapeHtml(siswa.nama)}</h2>
      <div style="color:var(--muted); font-size:13px; margin-top:4px;">${escapeHtml(siswa.kelas||'-')} &bull; NIS ${escapeHtml(siswa.nis||'-')}</div>
    </div>

    <div class="stat-grid">
      ${statCard(ICONS.trophy, rataKeseluruhan!==null?rataKeseluruhan:'-', 'Rata-rata Nilai', rataPerMapel.length? rataPerMapel.length+' mata pelajaran tercatat':'Belum ada data nilai', rataKeseluruhan===null?'var(--muted)':rataKeseluruhan>=75?'var(--success)':rataKeseluruhan>=60?'var(--warn)':'var(--danger)')}
      ${statCard(ICONS.kehadiran, kehadiranPct!==null&&kehadiranPct!==undefined? kehadiranPct+'%':'-', 'Persentase Kehadiran', kh.length? kh.length+' catatan tercatat':'Belum ada data', kehadiranPct===null?'var(--muted)':kehadiranPct>=85?'var(--success)':kehadiranPct>=60?'var(--warn)':'var(--danger)')}
      ${statCard(ICONS.disiplin, poin, 'Poin Pelanggaran', poin===0?'Tidak ada pelanggaran, pertahankan!':'Akumulasi poin kedisiplinan', poin===0?'var(--success)':poin<15?'var(--warn)':'var(--danger)')}
    </div>

    <div class="card">
      <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--accent) 16%, white); color:var(--accent);">${ICONS.trophy}</span><div><h3>Rata-rata Nilai per Mata Pelajaran</h3><div class="card-sub">Data lihat saja, tidak dapat diubah dari halaman ini</div></div></div></div>
      ${rataPerMapel.length?`<div class="table-wrap"><table><thead><tr><th>Mata Pelajaran</th><th>Rata-rata Nilai</th><th>Jumlah Entri</th></tr></thead><tbody>
        ${rataPerMapel.map(m=>`<tr><td>${escapeHtml(m.mapel)}</td><td><span class="pill ${m.rata>=75?'pill-green':m.rata>=60?'pill-amber':'pill-red'}">${m.rata}</span></td><td>${m.jumlahEntri}</td></tr>`).join('')}
      </tbody></table></div>`:emptyState('Belum ada data nilai untuk siswa ini.')}
    </div>

    <div class="card">
      <div class="card-head"><div class="flex items-center gap-8"><span class="card-icon-badge" style="background:color-mix(in srgb, var(--danger) 14%, white); color:var(--danger);">${ICONS.disiplin}</span><div><h3>Riwayat Pelanggaran Terakhir</h3><div class="card-sub">5 catatan kedisiplinan terbaru</div></div></div></div>

        ]).then(()=>{

          toast('Data berhasil diimpor', 'success');
          renderPengaturan();
        });
      }catch(err){ toast('File tidak valid atau rusak', 'error'); }
    };
    reader.readAsText(file);
  });
}

const APPS_SCRIPT_CODE = `function doPost(e) {
  var payload = JSON.parse(e.postData.contents);
  var sheetName = payload.sheetName || "Sheet1";
  var rows = payload.rows || [];
  var ss = SpreadsheetApp.getActiveSpreadsheet();
  var sheet = ss.getSheetByName(sheetName);
  if (!sheet) sheet = ss.insertSheet(sheetName);

  if (rows.length === 0) return ContentService.createTextOutput("OK");

  var headers = Object.keys(rows[0]);
  sheet.clearContents();
  sheet.appendRow(headers);
  rows.forEach(function(row) {
    sheet.appendRow(headers.map(function(h){ return row[h]; }));
  });

  return ContentService.createTextOutput("OK");
}`;

/* ---------------- Google Sheets Sync ---------------- */
async function syncToSheet(sheetName, rows){
  const url = DB.settings.sheetUrl;
  if(!url){ toast('Atur URL Google Sheet terlebih dahulu di halaman Pengaturan', 'error'); return; }
  if(!rows || rows.length===0){ toast('Tidak ada data untuk dikirim', 'error'); return; }
  try{
    await fetch(url, {
      method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({sheetName, rows})
    });
    toast('Data "'+sheetName+'" terkirim ke Google Sheet', 'success');
  }catch(e){
    toast('Gagal mengirim data. Periksa URL Web App.', 'error');
  }
}

boot();
